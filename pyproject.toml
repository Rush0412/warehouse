[project]
name = "sigma-service"
version = "0.1.0"
description = "FastAPI service for parsing, validating, and converting sigma rules"
authors = [{ name = "Sigma Service" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=1.10.0",
    "pysigma>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
